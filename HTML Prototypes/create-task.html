<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task | TaskFlow Prototype</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/create-task.js" defer></script>
</head>
<body>

<header>
    <h1>TaskFlow</h1>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="tasks.html">Tasks</a>
        <a href="create-task.html">Create Task</a>
        <a href="users.html">Users</a>
        <a href="signin.html">Sign in</a>
    </nav>
</header>


<main>
    <section class="compact-section task-form-section" aria-labelledby="task-form-heading">
        <h2 id="task-form-heading">Add a new task</h2>
        <form id="create-task-form" class="compact-form task-form-box">
            <div class="compact-row">
                <label for="label">Task:</label>
                <input type="text" id="label" name="label" required>
            </div>

            <div class="compact-row textarea-row">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="compact-row">
                <label for="dueDate">Due date:</label>
                <input type="date" id="dueDate" name="dueDate" required>
            </div>

            <fieldset class="status-fieldset">
                <legend>Status:</legend>
                <div class="status-options">
                    <input type="radio" id="not-started" name="status" value="Not started" checked>
                    <label for="not-started">Not started</label>

                    <input type="radio" id="in-progress" name="status" value="In progress">
                    <label for="in-progress">In progress</label>

                    <input type="radio" id="completed" name="status" value="Completed">
                    <label for="completed">Completed</label>
                </div>
            </fieldset>

            <div class="compact-button-row">
                <button type="submit">create</button>
            </div>
        </form>
    </section>
</main>


<footer>
    <p>TaskFlow - Web Application Development Project</p>
</footer>

</body>
</html>
