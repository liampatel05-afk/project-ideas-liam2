<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task | TaskFlow Prototype</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>
<body>

<header>
    <h1>TaskFlow</h1>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="tasks.html">Tasks</a>
        <a href="create-task.html">Create Task</a>
        <a href="users.html">Users</a>
        <a href="signin.html">Sign in</a>
    </nav>
</header>


<main>
    <section class="form-section" aria-labelledby="create-heading">
        <h2 id="create-heading">Add a new task</h2>
        <form class="task-form">
            <p>
                <label for="task">Task:</label>
                <input type="text" id="task" name="task" required>
            </p>
            <p>
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </p>
            <p>
                <label for="dueDate">Due date:</label>
                <input type="date" id="dueDate" name="dueDate" required>
            </p>
            <fieldset>
                <legend>Status</legend>
                <p><input type="radio" id="not-started" name="status" value="Not started" checked> <label for="not-started">Not started</label></p>
                <p><input type="radio" id="in-progress" name="status" value="In progress"> <label for="in-progress">In progress</label></p>
                <p><input type="radio" id="completed" name="status" value="Completed"> <label for="completed">Completed</label></p>
            </fieldset>
            <p class="form-buttons">
                <button type="submit">create</button>
            </p>
        </form>
    </section>
</main>


<footer>
    <p>TaskFlow - Web Application Development Project</p>
</footer>

</body>
</html>
