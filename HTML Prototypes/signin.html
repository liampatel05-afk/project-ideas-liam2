<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | TaskFlow Prototype</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
</head>
<body>

<header>
    <h1>TaskFlow</h1>
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="tasks.html">Tasks</a>
        <a href="create-task.html">Create Task</a>
        <a href="users.html">Users</a>
        <a href="signin.html">Sign in</a>
    </nav>
</header>


<main>
    <section class="form-section" aria-labelledby="signin-heading">
        <h2 id="signin-heading">Sign in to your account</h2>
        <form class="task-form">
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>
            <p class="form-buttons">
                <button type="submit">sign in</button>
            </p>
        </form>
    </section>
</main>


<footer>
    <p>TaskFlow - Web Application Development Project</p>
</footer>

</body>
</html>
