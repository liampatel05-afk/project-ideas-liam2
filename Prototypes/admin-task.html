<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
</head>

<body>
    <h1>Edit Task: Finish report</h1>

    <form method="POST" action="/tasks/1">
        <label>Title:</label><br>
        <input type="text" value="Finish report"><br><br>

        <label>Description:</label><br>
        <textarea>Write the final report for the project.</textarea><br><br>

        <label>Deadline:</label><br>
        <input type="date" value="2026-08-10"><br><br>

        <label>Status:</label><br>
        <select>
            <option selected>In Progress</option>
            <option>Completed</option>
        </select><br><br>

        <button>Save Changes</button>
    </form>

    <h2>Delete Task</h2>
    <form method="POST" action="/tasks/1/delete">
        <button style="color: red;">Delete Task</button>
    </form>
</body>
</html>
